<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" role="img" aria-labelledby="title desc">
  <title id="title">InkLathe avatar</title>
  <desc id="desc">Geometric IL monogram in solid and outlined lettering on a dark circular field.</desc>
  <defs>
    <mask id="worn-mark">
      <rect width="1024" height="1024" fill="white"/>
      <g fill="black">
        <path d="M211 312l94-17 8 30-96 19z"/>
        <path d="M329 465l93-9 5 24-91 17z"/>
        <path d="M197 665l112-22 10 29-118 17z"/>
        <path d="M350 726l74-10 6 20-77 14z"/>
        <path d="M555 357l72-16 8 26-77 13z"/>
        <path d="M550 567l66-10 5 21-69 12z"/>
        <path d="M660 690l96-13 5 24-98 14z"/>
        <path d="M736 727l54-7 4 18-57 9z"/>
        <ellipse cx="280" cy="410" rx="15" ry="8" transform="rotate(-12 280 410)"/>
        <ellipse cx="400" cy="591" rx="22" ry="10" transform="rotate(8 400 591)"/>
        <ellipse cx="578" cy="473" rx="16" ry="7" transform="rotate(-9 578 473)"/>
        <ellipse cx="725" cy="508" rx="23" ry="9" transform="rotate(11 725 508)"/>
        <ellipse cx="817" cy="600" rx="12" ry="6"/>
      </g>
    </mask>
  </defs>

  <rect width="1024" height="1024" fill="#151515"/>
  <circle cx="512" cy="512" r="432" fill="#1b1b1a" stroke="#302f2b" stroke-width="10"/>

  <g mask="url(#worn-mark)">
    <circle cx="512" cy="512" r="390" fill="none" stroke="#ece8dd" stroke-width="22"/>

    <!-- Solid I: the filled half of the InkLathe wordmark. -->
    <path fill="#ece8dd" d="M188 245h292v84h-88v366h88v84H188v-84h88V329h-88z"/>

    <!-- Outlined L: the outlined half of the InkLathe wordmark. -->
    <path d="M560 270v455h260" fill="none" stroke="#ece8dd" stroke-width="104" stroke-linecap="square" stroke-linejoin="miter"/>
    <path d="M560 270v455h260" fill="none" stroke="#1b1b1a" stroke-width="54" stroke-linecap="square" stroke-linejoin="miter"/>
  </g>

  <!-- Acid-green spindle detail shared with the web UI. -->
  <circle cx="789" cy="278" r="31" fill="#d6ff3f"/>
  <path d="M738 278h20M820 278h20" stroke="#d6ff3f" stroke-width="12"/>

  <g fill="#d6ff3f">
    <rect x="452" y="846" width="120" height="10"/>
    <rect x="586" y="846" width="28" height="10"/>
    <rect x="410" y="846" width="28" height="10"/>
  </g>
</svg>
