<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>InkLathe</title>
    <link rel="stylesheet" href="/static/style.css">
  </head>
  <body>
    <main>
      <header>
        <p class="eyebrow">SELF-HOSTED IMAGE WORKSHOP</p>
        <h1>Ink<span>Lathe</span></h1>
        <p>Refine black-and-white marks, illustrations, and prints — one file or a whole batch.</p>
      </header>

      <form id="job-form">
        <label class="drop" id="drop-zone">
          <input id="files" name="files" type="file" accept="image/png,image/jpeg,image/webp" multiple required>
          <strong>Drop images here</strong>
          <span>or click to select PNG, JPEG, or WebP files</span>
        </label>
        <div id="input-preview" class="preview-grid"></div>

        <section class="controls">
          <label>Upscaling
            <select name="upscale" id="upscale">
              <option value="lanczos">Lanczos preview</option>
              <option value="ai" id="ai-option">AI model</option>
              <option value="none">None</option>
            </select>
          </label>
          <label>Scale
            <select name="scale">
              <option value="2">2×</option>
              <option value="4" selected>4×</option>
            </select>
          </label>
          <label>Background
            <select name="background" id="background">
              <option value="threshold">Monochrome cutout</option>
              <option value="lucida" id="lucida-option">Lucida AI</option>
              <option value="none">Keep original</option>
            </select>
          </label>
          <label class="range-control">
            <span class="range-title">Grunge <output id="grunge-value">0 · none</output></span>
            <input name="grunge" id="grunge" type="range" min="0" max="100" value="0">
            <span class="range-hints"><span>0 none</span><span>25 light</span><span>60 pronounced</span><span>100 heavy</span></span>
          </label>
          <label>Random seed
            <input name="seed" type="number" value="1" min="0" max="2147483647">
          </label>
        </section>

        <button type="submit">Process images</button>
      </form>

      <section id="status" class="status" hidden></section>
      <section id="results" class="results" hidden>
        <div class="result-heading">
          <div>
            <p class="eyebrow">RUN HISTORY</p>
            <h2>Results</h2>
          </div>
          <span class="history-note">Newest run first</span>
        </div>
        <div id="result-history"></div>
      </section>
    </main>

    <dialog id="preview-dialog">
      <button id="preview-close" class="dialog-close" type="button" aria-label="Close preview">×</button>
      <img id="preview-large" alt="">
      <div class="dialog-caption">
        <strong id="preview-title"></strong>
        <span id="preview-meta"></span>
      </div>
    </dialog>
    <script src="/static/app.js" defer></script>
  </body>
</html>
