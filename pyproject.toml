[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "inklathe"
version = "0.1.0"
description = "A self-hosted workshop for restoring and distressing monochrome artwork"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.116,<1",
  "pillow>=11.3,<13",
  "python-multipart>=0.0.20,<1",
  "uvicorn[standard]>=0.35,<1",
]

[project.optional-dependencies]
dev = [
  "httpx>=0.28,<1",
  "pytest>=8.4,<9",
  "ruff>=0.12,<1",
]

[project.scripts]
inklathe = "inklathe.__main__:main"

[tool.hatch.build.targets.wheel]
packages = ["src/inklathe"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100

